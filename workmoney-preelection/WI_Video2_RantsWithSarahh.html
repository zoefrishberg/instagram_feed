    el.dataset.index = idx;
    el.innerHTML = `
      <video src="${esc(p.video)}" muted playsinline webkit-playsinline loop preload="${idx < 2 ? "auto" : "metadata"}"></video>
      <div class="missing">${esc(p.video)}<br>(video file not found — place it in the same folder)</div>
      <div class="shade-top"></div><div class="shade"></div>
      <div class="tapzone"></div>
      <div class="paused-icon">${I.play}</div>
      <div class="tapsound">${I.play}<span>Tap to play with sound</span></div>
      <div class="rail">
        <div class="avatar-wrap">
          <div class="avatar" style="${avatarStyle(p)}">${p.avatar ? "" : initial(p.handle)}</div>
          ${isAd ? "" : `<button class="follow" aria-label="Follow">${I.plusSmall}</button>`}
        </div>
        <button class="act like" aria-label="Like">${I.heart}<span class="n">${fmt(p.likes)}</span></button>
        <button class="act cmt" aria-label="Comments">${I.comment}<span>${fmt(p.comments)}</span></button>
        <button class="act bookmark" aria-label="Save">${I.bookmark}<span class="n">${fmt(p.bookmarks)}</span></button>
        <button class="act share" aria-label="Share">${I.share}<span>${fmt(p.shares)}</span></button>
        <div class="disc" style="${p.avatar ? `background-image:url('${esc(p.avatar)}')` : ""}"></div>
      </div>
      <div class="meta">
        <div class="user">${esc(p.handle)}${p.verified ? `<svg class="vbadge" width="14" height="14" viewBox="0 0 24 24"><circle cx="12" cy="12" r="11" fill="#20d5ec"/><path d="M7 12.3l3.2 3.1L17 8.6" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>` : ""}</div>
        <div class="caption">${captionHTML(p.caption)}</div>
        <button class="more" hidden>more</button>
        ${isAd ? `<div><span class="sponsored">Sponsored</span></div>` : ""}
        <div class="sound">${I.note}<div class="marquee"><div class="track"><span>${esc(p.sound)}</span><span>${esc(p.sound)}</span></div></div></div>
        ${isAd ? `<button class="cta" type="button">${esc(p.cta)}${I.chevron}</button>` : ""}
      </div>`;
    feed.appendChild(el);

    const video = el.querySelector("video");
    video.addEventListener("error", () => el.classList.add("no-video"));
    video.addEventListener("loadeddata", () => el.classList.remove("no-video"));

    // caption "more"
    const cap = el.querySelector(".caption"), more = el.querySelector(".more");
    const checkMore = () => { more.hidden = !(cap.scrollHeight > cap.clientHeight + 4); };
    requestAnimationFrame(checkMore); window.addEventListener("resize", checkMore);
    more.addEventListener("click", e => { e.stopPropagation(); const o = cap.classList.toggle("open"); more.textContent = o ? "less" : "more"; });

    // like
    const likeBtn = el.querySelector(".like");
    likeBtn.addEventListener("click", () => setLike(el, !state[id].liked));

    // follow
    const fb = el.querySelector(".follow");
    if (fb) fb.addEventListener("click", () => {
      state[id].followed = !state[id].followed;
      fb.classList.toggle("done", state[id].followed);
      fb.innerHTML = state[id].followed ? I.check : I.plusSmall;
      emit("follow", { post: id, on: state[id].followed });
    });

    // bookmark
    const bm = el.querySelector(".bookmark");
    bm.addEventListener("click", () => {
      const s = state[id]; s.saved = !s.saved;
      if (typeof s.bookmarks === "number") { s.bookmarks += s.saved ? 1 : -1; bm.querySelector(".n").textContent = fmt(s.bookmarks); }
      bm.classList.toggle("on", s.saved);
      emit("bookmark", { post: id, on: s.saved });
    });

    // share (no-op, just a press feedback)
    el.querySelector(".share").addEventListener("click", e => { pop(e.currentTarget); emit("share_tap", { post: id }); });

    // comments
    el.querySelector(".cmt").addEventListener("click", () => openComments(id));

    // CTA — looks real, goes nowhere
    const cta = el.querySelector(".cta");
    if (cta) cta.addEventListener("click", e => { e.preventDefault(); e.stopPropagation(); emit("ad_cta_tap", { post: id }); });

    // tap / double-tap
    const tz = el.querySelector(".tapzone");
    let lastTap = 0, tapTimer = null;
    tz.addEventListener("click", e => {
      if (!started) { startWithSound(); return; }
      const now = Date.now();
      if (now - lastTap < 280) {
        clearTimeout(tapTimer); lastTap = 0;
        heartBurst(el, e);
        if (!state[id].liked) setLike(el, true);
        return;
      }
      lastTap = now;
      tapTimer = setTimeout(() => togglePlay(el), 280);
    });
  });

  // light up ad CTA after a few seconds, like TikTok does
  function maybeLightCTA(el) {
    const cta = el.querySelector(".cta");
    if (cta && !cta.dataset.timer) cta.dataset.timer = setTimeout(() => cta.classList.add("lit"), 3000);
  }

  function pop(btn) { btn.classList.remove("pop"); void btn.offsetWidth; btn.classList.add("pop"); }

  function setLike(el, on) {
    const id = el.dataset.id, s = state[id], btn = el.querySelector(".like");
    if (s.liked === on) return;
    s.liked = on;
    if (s.likes !== null) { s.likes += on ? 1 : -1; btn.querySelector(".n").textContent = fmt(s.likes); }
    btn.classList.toggle("on", on);
    if (on) pop(btn);
    emit("like", { post: id, on });
  }

  function heartBurst(el, e) {
    const r = el.getBoundingClientRect();
    const h = document.createElement("div");
    h.className = "burst";
    h.style.left = (e.clientX - r.left) + "px";
    h.style.top = (e.clientY - r.top) + "px";
    h.style.setProperty("--r", (Math.random() * 40 - 20).toFixed(0) + "deg");
    h.innerHTML = I.burst;
    el.appendChild(h);
    setTimeout(() => h.remove(), 850);
  }

  function togglePlay(el) {
    const v = el.querySelector("video");
    if (v.paused) { el.dataset.userPaused = ""; v.play().catch(() => {}); el.classList.remove("paused"); }
    else { el.dataset.userPaused = "1"; v.pause(); el.classList.add("paused"); }
    emit(v.paused ? "pause" : "play", { post: el.dataset.id });
  }

  /* ---------- Autoplay in view ---------- */
  let current = null, viewStart = 0;
  const io = new IntersectionObserver(entries => {
    entries.forEach(en => {
      const el = en.target, v = el.querySelector("video");
      if (en.isIntersecting && en.intersectionRatio >= 0.6) {
        if (current !== el) {
          if (current) emit("post_exit", { post: current.dataset.id, dwell_ms: Date.now() - viewStart });
          current = el; viewStart = Date.now();
          emit("post_view", { post: el.dataset.id, position: +el.dataset.index });
          // preload next
          const nx = el.nextElementSibling && el.nextElementSibling.querySelector("video");
          if (nx) nx.preload = "auto";
        }
        delete el.dataset.userPaused;
        el.classList.remove("paused");
        if (started) {
          v.muted = muted;
          v.play().catch(() => { v.muted = true; v.play().catch(() => {}); });
        }
        maybeLightCTA(el);
      } else {
        v.pause();
        if (!en.isIntersecting) { try { v.currentTime = 0; } catch (e) {} }
      }
    });
  }, { root: feed, threshold: [0, 0.6] });
  feed.querySelectorAll(".post").forEach(p => io.observe(p));
  window.addEventListener("pagehide", () => { if (current) emit("post_exit", { post: current.dataset.id, dwell_ms: Date.now() - viewStart }); });

  /* ---------- Mute toggle ---------- */
  const SPK_ON = '<svg width="18" height="18" viewBox="0 0 24 24" fill="#fff"><path d="M3 9v6h4l5 5V4L7 9H3z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"/></svg>';
  const SPK_OFF = document.getElementById("spk").outerHTML;
  unmuteBtn.addEventListener("click", () => {
    muted = !muted;
    feed.querySelectorAll("video").forEach(v => v.muted = muted);
    if (current && !muted) current.querySelector("video").play().catch(() => {});
    unmuteBtn.classList.toggle("on", !muted);
    unmuteBtn.innerHTML = (muted ? SPK_OFF : SPK_ON) + '<span class="label">Tap to unmute</span>';
    emit(muted ? "mute" : "unmute", {});
  });

  /* ---------- First tap: start playback with sound ---------- */
  function startWithSound() {
    started = true; muted = false;
    document.getElementById("phone").classList.add("started");
    feed.querySelectorAll("video").forEach(v => v.muted = false);
    if (current) {
      current.classList.remove("paused");
      const v = current.querySelector("video");
      v.play().catch(() => { v.muted = true; muted = true; v.play().catch(() => {}); syncMuteBtn(); });
      maybeLightCTA(current);
    }
    syncMuteBtn();
    emit("tap_to_play", { post: current && current.dataset.id });
  }
  function syncMuteBtn() {
    unmuteBtn.classList.toggle("on", !muted);
    unmuteBtn.innerHTML = (muted ? SPK_OFF : SPK_ON) + '<span class="label">Tap to unmute</span>';
  }

  /* ---------- Comments drawer ---------- */
  function openComments(id) {
    const p = POSTS[id];
    dTitle.textContent = `${fmt(p.comments)} comments`;
    clist.innerHTML = (p.comments_list || []).map((c, i) => `
      <div class="c">
        <div class="cav" style="${c.avatar ? `background-image:url('${esc(c.avatar)}')` : `background:${colorFor(c.name)}`}">${c.avatar ? "" : initial(c.name)}</div>
        <div class="body">
          <div class="name">${esc(c.name)}</div>
          <div class="text">${esc(c.text)}</div>
          ${c.image ? `<img class="cimg" src="${esc(c.image)}" alt="" onerror="this.outerHTML='<div class=&quot;cimg missing-img&quot;>${esc(c.image)}</div>'">` : ""}
          <div class="sub"><span>${esc(c.ago || "1d")}</span><span>Reply</span></div>
          ${c.replies ? `<div class="replies">View ${c.replies} ${c.replies === 1 ? "reply" : "replies"}</div>` : ""}
        </div>
        <button class="clike" data-i="${i}">${I.smallHeart}<span>${c.likes ? fmt(c.likes) : ""}</span></button>
      </div>`).join("");
    clist.querySelectorAll(".clike").forEach(b => b.addEventListener("click", () => {
      const c = p.comments_list[+b.dataset.i];
      const on = b.classList.toggle("on");
      const n = (c.likes || 0) + (on ? 1 : 0);
      b.querySelector("span").textContent = n ? fmt(n) : "";
      emit("comment_like", { post: id, comment: +b.dataset.i, on });
    }));
    clist.scrollTop = 0;
    backdrop.classList.add("open");
    drawer.classList.add("open");
    emit("comments_open", { post: id });
  }
  function closeComments() {
    backdrop.classList.remove("open");
    drawer.classList.remove("open");
  }
  backdrop.addEventListener("click", closeComments);
  document.getElementById("dClose").addEventListener("click", closeComments);

  /* ---------- Keyboard (desktop) ---------- */
  document.addEventListener("keydown", e => {
    if (e.key === "Escape") return closeComments();
    if (e.key === "ArrowDown" || e.key === "ArrowUp") {
      e.preventDefault();
      feed.scrollBy({ top: (e.key === "ArrowDown" ? 1 : -1) * feed.clientHeight, behavior: "smooth" });
    }
  });

  /* ---------- Block every navigation away ---------- */
  document.addEventListener("click", e => { const a = e.target.closest("a"); if (a) e.preventDefault(); }, true);

  /* ---------- Status bar clock ---------- */
  const clock = document.getElementById("clock");
  const tick = () => { const d = new Date(); clock.textContent = d.getHours() % 12 || 12; clock.textContent += ":" + String(d.getMinutes()).padStart(2, "0"); };
  tick(); setInterval(tick, 30000);
})();
</script>
</body>
</html>
