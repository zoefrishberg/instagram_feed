<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>For You</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; background: #e9e9ee; overflow: hidden; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
    display: flex; align-items: center; justify-content: center;
    -webkit-user-select: none; user-select: none; color: #fff;
  }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }

  /* ---------- Phone frame (desktop) ---------- */
  .phone {
    width: 320px; height: min(680px, calc(100vh - 24px));
    background: #0b0b0b; border-radius: 46px; padding: 10px;
    box-shadow: 0 0 0 2px #2a2a2a, 0 20px 50px rgba(0,0,0,.35);
    position: relative;
  }
  .screen {
    width: 100%; height: 100%; border-radius: 37px; overflow: hidden;
    background: #000; position: relative; display: flex; flex-direction: column;
  }
  .statusbar {
    position: absolute; top: 0; left: 0; right: 0; height: 40px; z-index: 30;
    display: flex; align-items: center; justify-content: space-between;
    padding: 4px 26px 0 30px; font-size: 14px; font-weight: 600; pointer-events: none;
  }
  .statusbar .island { position: absolute; left: 50%; top: 9px; transform: translateX(-50%); width: 88px; height: 24px; background: #000; border-radius: 14px; }
  .statusbar .icons { display: flex; gap: 5px; align-items: center; }

  /* ---------- Full screen on mobile ---------- */
  @media (max-width: 480px) {
    body { background: #000; }
    .phone { width: 100vw; height: 100vh; height: 100dvh; border-radius: 0; padding: 0; box-shadow: none; }
    .screen { border-radius: 0; }
    .statusbar { display: none; }
    .topbar { top: env(safe-area-inset-top, 0px) !important; }
    .navbar { padding-bottom: env(safe-area-inset-bottom, 0px); height: calc(50px + env(safe-area-inset-bottom, 0px)) !important; }
  }

  /* ---------- Top tabs ---------- */
  .topbar {
    position: absolute; top: 38px; left: 0; right: 0; z-index: 20; height: 40px;
    display: flex; align-items: center; justify-content: center; gap: 18px; pointer-events: none;
    text-shadow: 0 1px 3px rgba(0,0,0,.4);
  }
  .topbar .tab { font-size: 15px; font-weight: 600; color: rgba(255,255,255,.65); position: relative; pointer-events: auto; }
  .topbar .tab.active { color: #fff; }
  .topbar .tab.active::after { content: ""; position: absolute; left: 50%; bottom: -7px; transform: translateX(-50%); width: 26px; height: 2.5px; border-radius: 2px; background: #fff; }
  .topbar .divider { width: 1px; height: 12px; background: rgba(255,255,255,.45); }
  .topbar .live, .topbar .search { position: absolute; top: 50%; transform: translateY(-50%); pointer-events: auto; }
  .topbar .live { left: 14px; font-size: 10px; font-weight: 700; border: 1.5px solid #fff; border-radius: 4px; padding: 1px 3px; }
  .topbar .search { right: 14px; }

  /* ---------- Unmute pill ---------- */
  .sound-toggle {
    position: absolute; top: 86px; left: 12px; z-index: 25;
    display: flex; align-items: center; gap: 6px;
    background: rgba(0,0,0,.55); border-radius: 18px; padding: 7px 12px 7px 10px;
    font-size: 13px; font-weight: 600; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  }
  .sound-toggle.unmuted { padding: 7px; }
  .sound-toggle.unmuted .label { display: none; }
  @media (max-width: 480px) { .sound-toggle { top: calc(52px + env(safe-area-inset-top, 0px)); } }

  /* ---------- Feed ---------- */
  .feed {
    flex: 1; overflow: hidden; touch-action: none; overscroll-behavior: none;
    scrollbar-width: none; -webkit-overflow-scrolling: touch;
  }
  .feed::-webkit-scrollbar { display: none; }
  .slide { height: 100%; width: 100%; position: relative; scroll-snap-align: start; scroll-snap-stop: always; overflow: hidden; background: #000; }
  .slide video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; background: #000; }
  .slide .fallback {
    position: absolute; inset: 0; display: none; align-items: center; justify-content: center; text-align: center;
    font-size: 12px; color: rgba(255,255,255,.6); padding: 24px;
  }
  .slide.missing .fallback { display: flex; }
  .slide .shade { position: absolute; left: 0; right: 0; bottom: 0; height: 45%; background: linear-gradient(transparent, rgba(0,0,0,.55)); pointer-events: none; }
  .tap-layer { position: absolute; inset: 0; z-index: 2; }
  .paused-icon {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%) scale(1.3); z-index: 3;
    opacity: 0; transition: opacity .15s, transform .15s; pointer-events: none;
  }
  .slide.paused .paused-icon { opacity: .75; transform: translate(-50%,-50%) scale(1); }

  /* Right rail */
  .rail { position: absolute; right: 6px; bottom: 8px; z-index: 5; display: flex; flex-direction: column; align-items: center; gap: 14px; pointer-events: none; }
  .rail > * { pointer-events: auto; }
  .rail .act { display: flex; flex-direction: column; align-items: center; font-size: 11.5px; font-weight: 600; text-shadow: 0 1px 2px rgba(0,0,0,.5); }
  .rail .act svg { filter: drop-shadow(0 1px 2px rgba(0,0,0,.35)); }
  .rail .act span { margin-top: 2px; }
  .avatar-wrap { position: relative; margin-bottom: 8px; }
  .avatar {
    width: 44px; height: 44px; border-radius: 50%; border: 1.5px solid #fff; background-size: cover; background-position: center;
    display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 18px;
  }
  .follow-plus {
    position: absolute; left: 50%; bottom: -9px; transform: translateX(-50%); width: 20px; height: 20px; border-radius: 50%;
    background: #fe2c55; display: flex; align-items: center; justify-content: center; transition: transform .2s, background .2s;
  }
  .follow-plus.done { background: #fff; }
  .like-btn.liked svg path { fill: #fe2c55; }
  .like-btn.pop svg { animation: pop .35s ease; }
  @keyframes pop { 0%{transform:scale(1)} 40%{transform:scale(1.3)} 100%{transform:scale(1)} }
  .save-btn.saved svg path { fill: #facc15; }
  .disc {
    width: 40px; height: 40px; border-radius: 50%; margin-top: 4px;
    background: radial-gradient(circle, #444 0 22%, #111 23% 100%); border: 7px solid #222;
    display: flex; align-items: center; justify-content: center; animation: spin 5s linear infinite;
  }
  .disc i { width: 14px; height: 14px; border-radius: 50%; background-size: cover; display: block; }
  .slide.paused .disc, .slide:not(.active) .disc { animation-play-state: paused; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Bottom-left meta */
  .meta { position: absolute; left: 12px; right: 74px; bottom: 8px; z-index: 5; pointer-events: none; text-shadow: 0 1px 2px rgba(0,0,0,.45); }
  .meta > * { pointer-events: auto; }
  .meta .handle { font-weight: 700; font-size: 15px; margin-bottom: 5px; display: inline-block; }
  .meta .caption { font-size: 13.5px; line-height: 1.35; margin-bottom: 2px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .meta .caption.open { -webkit-line-clamp: unset; }
  .meta .caption b { font-weight: 700; }
  .meta .sponsored { display: inline-block; font-size: 11px; background: rgba(255,255,255,.22); padding: 1px 5px; border-radius: 3px; margin-bottom: 6px; }
  .meta .sound { display: flex; align-items: center; gap: 6px; font-size: 13px; overflow: hidden; }
  .meta .sound .marquee { overflow: hidden; white-space: nowrap; flex: 1; mask-image: linear-gradient(90deg, #000 85%, transparent); -webkit-mask-image: linear-gradient(90deg, #000 85%, transparent); }
  .meta .sound .marquee span { display: inline-block; padding-right: 40px; animation: marquee 9s linear infinite; }
  .slide.paused .marquee span, .slide:not(.active) .marquee span { animation-play-state: paused; }
  @keyframes marquee { from { transform: translateX(0); } to { transform: translateX(-50%); } }
  .cta {
    margin-top: 9px; width: 100%; height: 36px; border-radius: 4px; font-size: 14px; font-weight: 600;
    display: flex; align-items: center; justify-content: space-between; padding: 0 12px;
    background: rgba(255,255,255,.25); transition: background .5s; text-shadow: none;
  }
  .cta.lit { background: #fe2c55; }

  /* Progress */
  .progress { position: absolute; left: 0; right: 0; bottom: 0; height: 2px; background: rgba(255,255,255,.18); z-index: 6; }
  .progress i { display: block; height: 100%; width: 0; background: rgba(255,255,255,.75); }

  /* Double-tap heart */
  .burst { position: absolute; z-index: 4; pointer-events: none; transform: translate(-50%,-50%); animation: burst .9s ease-out forwards; }
  @keyframes burst {
    0% { opacity: 0; transform: translate(-50%,-50%) scale(.4) rotate(var(--r)); }
    15% { opacity: 1; transform: translate(-50%,-50%) scale(1.15) rotate(var(--r)); }
    30% { transform: translate(-50%,-50%) scale(.95) rotate(var(--r)); }
    70% { opacity: 1; transform: translate(-50%,-60%) scale(1) rotate(var(--r)); }
    100% { opacity: 0; transform: translate(-50%,-120%) scale(1.4) rotate(var(--r)); }
  }

  /* ---------- Bottom nav ---------- */
  .navbar { height: 50px; background: #000; display: flex; align-items: center; justify-content: space-around; flex-shrink: 0; border-top: 1px solid #161616; z-index: 10; }
  .navbar .nav { display: flex; flex-direction: column; align-items: center; font-size: 10px; color: rgba(255,255,255,.6); gap: 2px; width: 52px; }
  .navbar .nav.active { color: #fff; }
  .navbar .create { width: 44px; height: 28px; position: relative; }
  .navbar .create::before, .navbar .create::after { content: ""; position: absolute; top: 0; bottom: 0; width: 38px; border-radius: 8px; }
  .navbar .create::before { left: 0; background: #25f4ee; }
  .navbar .create::after { right: 0; background: #fe2c55; }
  .navbar .create b { position: absolute; left: 4px; right: 4px; top: 0; bottom: 0; background: #fff; border-radius: 7px; z-index: 1; display: flex; align-items: center; justify-content: center; }

  /* ---------- Tap-to-play (only if the browser blocks sound autoplay) ---------- */
  .start-gate { position: absolute; inset: 0; z-index: 35; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 14px; background: rgba(0,0,0,.35); }
  .start-gate.show { display: flex; }
  .start-gate .gate-btn { width: 84px; height: 84px; border-radius: 50%; background: rgba(0,0,0,.55); display: flex; align-items: center; justify-content: center; padding-left: 6px; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
  .start-gate .gate-label { font-size: 15px; font-weight: 600; text-shadow: 0 1px 3px rgba(0,0,0,.6); }

  /* ---------- Comments drawer ---------- */
  .backdrop { position: absolute; inset: 0; z-index: 40; background: rgba(0,0,0,0); pointer-events: none; transition: background .25s; }
  .backdrop.show { background: rgba(0,0,0,.25); pointer-events: auto; }
  .drawer {
    position: absolute; left: 0; right: 0; bottom: 0; height: 70%; z-index: 41; background: #fff; color: #161823;
    border-radius: 12px 12px 0 0; transform: translateY(100%); transition: transform .3s cubic-bezier(.2,.8,.2,1);
    display: flex; flex-direction: column;
  }
  .drawer.show { transform: translateY(0); }
  .drawer header { height: 46px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 600; position: relative; }
  .drawer header .close { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); padding: 6px; }
  .drawer .list { flex: 1; overflow-y: auto; padding: 4px 14px 10px; overscroll-behavior: contain; }
  .comment { display: flex; gap: 10px; padding: 9px 0; }
  .comment .cav { width: 32px; height: 32px; border-radius: 50%; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; color: #fff; }
  .comment .body { flex: 1; min-width: 0; }
  .comment .user { font-size: 12.5px; color: #8a8b91; font-weight: 600; margin-bottom: 2px; }
  .comment .text { font-size: 14px; line-height: 1.35; word-wrap: break-word; }
  .comment .sub { font-size: 12px; color: #8a8b91; margin-top: 5px; display: flex; gap: 16px; }
  .comment .clike { display: flex; flex-direction: column; align-items: center; font-size: 11.5px; color: #8a8b91; width: 30px; padding-top: 6px; }
  .comment .clike.liked path { fill: #fe2c55; stroke: #fe2c55; }
  .drawer .inputbar { flex-shrink: 0; border-top: 1px solid #eee; padding: 8px 12px; display: flex; align-items: center; gap: 10px; padding-bottom: calc(8px + env(safe-area-inset-bottom, 0px)); }
  .drawer .inputbar .cav { width: 30px; height: 30px; border-radius: 50%; background: #c7c7cc; flex-shrink: 0; }
  .drawer .inputbar .field { flex: 1; background: #f1f1f2; border-radius: 18px; padding: 8px 14px; font-size: 14px; color: #8a8b91; }
</style>

  play: '<svg width="64" height="64" viewBox="0 0 24 24" fill="#fff"><path d="M7 4.5v15c0 .8.9 1.3 1.6.8l11.7-7.5c.6-.4.6-1.3 0-1.7L8.6 3.7C7.9 3.2 7 3.7 7 4.5z"/></svg>',
  note: '<svg width="13" height="13" viewBox="0 0 24 24" fill="#fff"><path d="M9 18.5a3 3 0 1 1-2-2.8V4.6c0-.5.3-.9.8-1l10-2.3c.6-.1 1.2.3 1.2 1v13.2a3 3 0 1 1-2-2.8V6.3l-8 1.9z"/></svg>',
  mutedSpk: '<path d="M3 9v6h4l5 4.5V4.5L7 9zm13.6 3l2.7-2.7-1.1-1.1-2.7 2.7-2.7-2.7-1.1 1.1 2.7 2.7-2.7 2.7 1.1 1.1 2.7-2.7 2.7 2.7 1.1-1.1z"/>',
  onSpk: '<path d="M3 9v6h4l5 4.5V4.5L7 9zm11.5-.9a5 5 0 0 1 0 7.8l-1-1.2a3.5 3.5 0 0 0 0-5.4zm2.4-2.9a9 9 0 0 1 0 13.6l-1-1.2a7.4 7.4 0 0 0 0-11.2z"/>',
  bigHeart: '<svg width="96" height="96" viewBox="0 0 24 24"><defs><linearGradient id="hg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff4d6d"/><stop offset="1" stop-color="#fe2c55"/></linearGradient></defs><path fill="url(#hg)" d="M12 21.2l-1.4-1.3C5.4 15.2 2 12.1 2 8.3 2 5.2 4.4 2.8 7.5 2.8c1.7 0 3.4.8 4.5 2.1 1.1-1.3 2.8-2.1 4.5-2.1 3.1 0 5.5 2.4 5.5 5.5 0 3.8-3.4 6.9-8.6 11.6z"/></svg>',
  smallHeart: '<svg width="16" height="16" viewBox="0 0 24 24"><path fill="none" stroke="#8a8b91" stroke-width="2" d="M12 20.3l-1.2-1.1C6 14.9 3 12.2 3 8.8 3 6.1 5.1 4 7.8 4c1.5 0 3 .7 4.2 1.9C13.2 4.7 14.7 4 16.2 4 18.9 4 21 6.1 21 8.8c0 3.4-3 6.1-7.8 10.4z"/></svg>',
  check: '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#fe2c55" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12l5 5L20 6"/></svg>',
  plus: '<svg width="11" height="11" viewBox="0 0 16 16" stroke="#fff" stroke-width="3" stroke-linecap="round"><path d="M8 2v12M2 8h12"/></svg>',
  chevron: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>'
};

/* ---------- State ---------- */
const state = { muted: false, userMuted: false, active: null, posts: {} };
const feed = $("#feed");

/* ---------- Build slides ---------- */
FEED_CONFIG.posts.slice(0, 1).forEach((p, idx) => {
  const s = { liked: false, saved: false, followed: false, likes: p.likes, userPaused: false, ctaTimer: null, commentLikes: {} };
  state.posts[p.id] = s;

  const avatarStyle = p.avatar ? `background-image:url('${esc(p.avatar)}')` : `background-color:${p.avatarColor || colorFor(p.handle)}`;
  const avatarInner = p.avatar ? "" : esc(p.handle[0].toUpperCase());
  const isAd = p.type === "ad";

  const el = document.createElement("section");
  el.className = "slide";
  el.dataset.id = p.id;
  el.dataset.index = idx;
  el.innerHTML = `
    <video ${p.fit ? `style="object-fit:${esc(p.fit)}"` : ""} src="${videoSrc(p.video)}" ${p.poster ? `poster="${esc(p.poster)}"` : ""} muted playsinline webkit-playsinline loop preload="${idx < 2 ? "auto" : "metadata"}" disablepictureinpicture controlslist="nodownload noplaybackrate nofullscreen"></video>
    <div class="fallback">Video file not found:<br>${esc(p.video)}</div>
    <div class="shade"></div>
    <div class="tap-layer"></div>
    <div class="paused-icon">${ICONS.play}</div>

    <div class="rail">
      <div class="avatar-wrap">
        <button class="avatar" data-noop style="${avatarStyle}">${avatarInner}</button>
        ${isAd ? "" : `<button class="follow-plus" aria-label="Follow">${ICONS.plus}</button>`}
      </div>
      <button class="act like-btn" aria-label="Like">${ICONS.heart}<span class="count">${fmt(p.likes)}</span></button>
      <button class="act comment-btn" aria-label="Comments">${ICONS.comment}<span>${fmt(p.commentCount)}</span></button>
      <button class="act save-btn" aria-label="Save">${ICONS.bookmark}<span>${fmt(p.saves)}</span></button>
      <button class="act share-btn" data-noop aria-label="Share">${ICONS.share}<span>${fmt(p.shares)}</span></button>
      <div class="disc"><i style="${avatarStyle}"></i></div>
    </div>

    <div class="meta">
      <button class="handle" data-noop>${esc(p.handle)}</button>
      <div class="caption">${tagify(p.caption)}</div>
      ${p.sponsoredLabel ? `<div class="sponsored">${esc(p.sponsoredLabel)}</div>` : ""}
      ${p.sound ? `<div class="sound">${ICONS.note}<div class="marquee"><span>${esc(p.sound)}</span><span>${esc(p.sound)}</span></div></div>` : ""}
      ${isAd && p.ctaText ? `<button class="cta" data-noop data-cta>${esc(p.ctaText)} ${ICONS.chevron}</button>` : ""}
    </div>

    <div class="progress"><i></i></div>
  `;
  feed.appendChild(el);

  const video = $("video", el);
  video.muted = true;
  video.addEventListener("error", () => el.classList.add("missing"));
  video.addEventListener("timeupdate", () => {
    if (video.duration) $(".progress i", el).style.width = (video.currentTime / video.duration * 100) + "%";
  });

  /* Tap = pause/play, double-tap = like + heart */
  let lastTap = 0, singleTimer = null;
  $(".tap-layer", el).addEventListener("click", e => {
    const now = Date.now();
    if (now - lastTap < 300) {
      clearTimeout(singleTimer);
      lastTap = 0;
      const r = el.getBoundingClientRect();
      showHeart(el, e.clientX - r.left, e.clientY - r.top);
      if (!s.liked) setLike(el, p, true, "double_tap");
    } else {
      lastTap = now;
      singleTimer = setTimeout(() => togglePause(el, p), 300);
    }
  });

  $(".like-btn", el).addEventListener("click", () => setLike(el, p, !s.liked, "button"));
  $(".comment-btn", el).addEventListener("click", () => openDrawer(p));
  $(".save-btn", el).addEventListener("click", () => {
    s.saved = !s.saved;
    const btn = $(".save-btn", el);
    btn.classList.toggle("saved", s.saved);
    $("span", btn).textContent = fmt(p.saves + (s.saved ? 1 : 0));
    track(s.saved ? "save" : "unsave", { postId: p.id });
  });
  const fp = $(".follow-plus", el);
  if (fp) fp.addEventListener("click", () => {
    s.followed = true; fp.classList.add("done"); fp.innerHTML = ICONS.check;
    track("follow", { postId: p.id });
    setTimeout(() => { fp.style.transform = "translateX(-50%) scale(0)"; }, 700);
  });
  $(".caption", el).addEventListener("click", ev => ev.currentTarget.classList.toggle("open"));
});

function setLike(el, p, on, via) {
  const s = state.posts[p.id];
  s.liked = on;
  s.likes = p.likes + (on ? 1 : 0);
  const btn = $(".like-btn", el);
  btn.classList.toggle("liked", on);
  $(".count", btn).textContent = fmt(s.likes);
  btn.classList.remove("pop"); void btn.offsetWidth; btn.classList.add("pop");
  track(on ? "like" : "unlike", { postId: p.id, via });
}

function showHeart(el, x, y) {
  const h = document.createElement("div");
  h.className = "burst";
  h.style.left = x + "px"; h.style.top = y + "px";
  h.style.setProperty("--r", (Math.random() * 40 - 20).toFixed(0) + "deg");
  h.innerHTML = ICONS.bigHeart;
  el.appendChild(h);
  setTimeout(() => h.remove(), 950);
}

function togglePause(el, p) {
  const v = $("video", el), s = state.posts[p.id];
  if (v.paused) { s.userPaused = false; playVideo(el); track("play", { postId: p.id }); }
  else { s.userPaused = true; v.pause(); el.classList.add("paused"); track("pause", { postId: p.id }); }
}

const gate = document.getElementById("startGate");
function showStartGate(el) {
  if (gate.classList.contains("show")) return;
  gate.classList.add("show");
  track("autoplay_blocked", { postId: el.dataset.id });
  gate.onclick = e => {
    e.stopPropagation();
    gate.classList.remove("show");
    setMuted(false);
    const v = $("video", el);
    v.muted = false;
    v.play().then(() => track("play_with_sound", { postId: el.dataset.id, via: "start_gate" }))
     .catch(() => { v.muted = true; setMuted(true); v.play().catch(() => {}); });
  };
}

function playVideo(el) {
  const v = $("video", el);
  v.muted = state.muted;
  el.classList.remove("paused");
  const pr = v.play();
  if (pr && pr.catch) pr.catch(() => {
    // Browser blocked autoplay with sound: show the tap-to-play screen.
    // The respondent's tap counts as permission, so the video then plays WITH sound.
    if (!v.muted) showStartGate(el);
    else el.classList.add("paused");
  });
}

/* ---------- Autoplay in view / pause out of view ---------- */
const io = new IntersectionObserver(entries => {
  entries.forEach(en => {
    const el = en.target, id = el.dataset.id, p = FEED_CONFIG.posts[el.dataset.index], s = state.posts[id];
    const v = $("video", el);
    if (en.isIntersecting && en.intersectionRatio >= 0.6) {
      if (state.active === el) return;
      state.active = el;
      el.classList.add("active");
      s.userPaused = false;
      s.viewStart = Date.now();
      playVideo(el);
      track("view_start", { postId: id, type: p.type, position: +el.dataset.index + 1 });
      // Preload the next video
      const next = el.nextElementSibling;
      if (next) $("video", next).preload = "auto";
      // Ad CTA lights up after 3s, like TikTok
      if (p.type === "ad") {
        const cta = $("[data-cta]", el);
        clearTimeout(s.ctaTimer);
        if (cta) s.ctaTimer = setTimeout(() => { cta.classList.add("lit"); if (p.ctaColor) cta.style.background = p.ctaColor; }, 3000);
      }
    } else if (!en.isIntersecting || en.intersectionRatio < 0.6) {
      if (state.active === el) state.active = null;
      if (el.classList.contains("active")) {
        track("view_end", { postId: id, type: p.type, ms: Date.now() - (s.viewStart || Date.now()) });
      }
      el.classList.remove("active");
      v.pause();
      try { v.currentTime = 0; } catch (e) {}
      el.classList.remove("paused");
      clearTimeout(s.ctaTimer);
    }
  });
}, { root: feed, threshold: [0, 0.6, 1] });
document.querySelectorAll(".slide").forEach(sl => io.observe(sl));

/* ---------- Mute / unmute ---------- */
const soundBtn = $("#soundToggle");
function setMuted(m) {
  state.muted = m;
  soundBtn.classList.toggle("unmuted", !m);
  $(".ico", soundBtn).innerHTML = m ? ICONS.mutedSpk : ICONS.onSpk;
  soundBtn.setAttribute("aria-label", m ? "Unmute" : "Mute");
  document.querySelectorAll(".slide video").forEach(v => v.muted = m);
}
soundBtn.addEventListener("click", e => {
  e.stopPropagation();
  setMuted(!state.muted);
  state.userMuted = state.muted;
  track(state.muted ? "mute" : "unmute", { postId: state.active && state.active.dataset.id });
  if (state.active) { const v = $("video", state.active); if (v.paused && !state.posts[state.active.dataset.id].userPaused) playVideo(state.active); }
});
setMuted(false);

/* Sound is on by default. If the browser blocks autoplay with sound, the video
   starts muted and sound turns on at the respondent's first tap anywhere. */
function autoUnmute() {
  if (!state.muted || state.userMuted) return;
  setMuted(false);
  if (state.active) { const v = $("video", state.active); v.muted = false; if (v.paused && !state.posts[state.active.dataset.id].userPaused) playVideo(state.active); }
  track("auto_unmute", {});
}

/* ---------- Comments drawer ---------- */
const drawer = $("#drawer"), backdrop = $("#backdrop"), list = $("#commentList");
let drawerPost = null;
function openDrawer(p) {
  drawerPost = p;
  const s = state.posts[p.id];
  $("#drawerTitle").textContent = `${fmt(p.commentCount)} comments`;
  list.innerHTML = p.comments.map((c, i) => {
    const liked = !!s.commentLikes[i];
    return `
    <div class="comment">
      <div class="cav" style="background:${colorFor(c.user)}">${esc(c.user[0].toUpperCase())}</div>
      <div class="body">
        <div class="user">${esc(c.user)}</div>
        <div class="text">${esc(c.text)}</div>
        <div class="sub"><span>${esc(c.time || "1d")}</span><span>Reply</span></div>
      </div>
      <button class="clike ${liked ? "liked" : ""}" data-i="${i}">${ICONS.smallHeart}<span>${fmt(c.likes + (liked ? 1 : 0))}</span></button>
    </div>`;
  }).join("");
  list.scrollTop = 0;
  drawer.classList.add("show");
  backdrop.classList.add("show");
  track("comments_open", { postId: p.id });
}
function closeDrawer() {
  if (!drawer.classList.contains("show")) return;
  drawer.classList.remove("show");
  backdrop.classList.remove("show");
  track("comments_close", { postId: drawerPost && drawerPost.id });
}
backdrop.addEventListener("click", closeDrawer);
$("#drawerClose").addEventListener("click", closeDrawer);
list.addEventListener("click", e => {
  const b = e.target.closest(".clike");
  if (!b || !drawerPost) return;
  const i = +b.dataset.i, s = state.posts[drawerPost.id];
  s.commentLikes[i] = !s.commentLikes[i];
  b.classList.toggle("liked", s.commentLikes[i]);
  $("span", b).textContent = fmt(drawerPost.comments[i].likes + (s.commentLikes[i] ? 1 : 0));
  track("comment_like", { postId: drawerPost.id, commentIndex: i, liked: s.commentLikes[i] });
});

/* ---------- Dead-end controls (look real, go nowhere) ---------- */
document.addEventListener("click", e => {
  const n = e.target.closest("[data-noop]");
  if (!n) return;
  e.preventDefault();
  if (n.hasAttribute("data-cta")) track("cta_click", { postId: n.closest(".slide").dataset.id });
}, true);
// Belt and braces: never follow a link or open a window
document.addEventListener("click", e => { if (e.target.closest("a")) e.preventDefault(); }, true);
window.open = () => null;
document.addEventListener("contextmenu", e => e.preventDefault());

/* Lock the feed in place (no scrolling to other videos) */
["wheel", "touchmove"].forEach(ev => feed.addEventListener(ev, e => e.preventDefault(), { passive: false }));

/* Esc closes comments */
document.addEventListener("keydown", e => {
  if (e.key === "Escape") closeDrawer();
});
</script>
</body>
</html>
